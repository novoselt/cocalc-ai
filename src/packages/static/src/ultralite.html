<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex,nofollow" />
    <title>CoCalc Essential</title>
    <script>
      try {
        const preference = localStorage.getItem("cocalc-essential-theme");
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
    <style>
      body {
        background: Canvas;
        color: CanvasText;
        margin: 0;
      }
      .ultralite-static-shell {
        box-sizing: border-box;
        margin: 12vh auto;
        max-width: 44rem;
        padding: 2rem;
      }
      .ultralite-static-shell p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body data-cocalc-entry="ultralite">
    <div id="cocalc-ultralite-root">
      <main class="ultralite-static-shell">
        <h1>CoCalc Essential</h1>
        <p>Opening the essential CoCalc workspace...</p>
      </main>
    </div>
    <noscript>CoCalc Essential requires JavaScript.</noscript>
  </body>
</html>
