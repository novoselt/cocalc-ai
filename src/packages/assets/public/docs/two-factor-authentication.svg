<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">CoCalc two-factor authentication</title>
  <desc id="desc">Diagram showing Google sign-in, CoCalc authenticator codes, passkeys, and fresh two-factor checks for dangerous actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="0.5" stop-color="#f6fbf8"/>
      <stop offset="1" stop-color="#fff8ec"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1f2a44" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f8f"/>
    </marker>
  </defs>

  <rect width="960" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="814" cy="104" r="86" fill="#fee8b8" opacity="0.45"/>
  <circle cx="128" cy="448" r="112" fill="#b7e4d2" opacity="0.35"/>

  <text x="70" y="74" fill="#1f2a44" font-family="Avenir Next, Segoe UI, sans-serif" font-size="36" font-weight="700">CoCalc two-factor authentication</text>
  <text x="72" y="112" fill="#516276" font-family="Avenir Next, Segoe UI, sans-serif" font-size="18">Use Google SSO for sign-in, then CoCalc 2FA for recent approval of high-impact actions.</text>

  <g filter="url(#shadow)">
    <rect x="68" y="168" width="230" height="210" rx="22" fill="url(#card)" stroke="#c8d8e8"/>
    <rect x="96" y="196" width="64" height="64" rx="18" fill="#e8f1ff"/>
    <text x="128" y="238" text-anchor="middle" fill="#2f6f8f" font-family="Avenir Next, Segoe UI, sans-serif" font-size="32" font-weight="700">G</text>
    <text x="96" y="292" fill="#1f2a44" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20" font-weight="700">Google or SSO</text>
    <text x="96" y="322" fill="#516276" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">Proves who signed in.</text>
    <text x="96" y="348" fill="#516276" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">May have happened days ago.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="148" width="230" height="250" rx="22" fill="url(#card)" stroke="#c8d8e8"/>
    <rect x="396" y="182" width="78" height="78" rx="20" fill="#e8f7f0"/>
    <path d="M435 205 c-17 0 -31 14 -31 31 v13 h62 v-13 c0 -17 -14 -31 -31 -31z" fill="none" stroke="#2f8f66" stroke-width="8" stroke-linecap="round"/>
    <rect x="407" y="240" width="56" height="42" rx="10" fill="#2f8f66"/>
    <circle cx="435" cy="260" r="6" fill="#ffffff"/>
    <text x="396" y="314" fill="#1f2a44" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20" font-weight="700">CoCalc 2FA</text>
    <text x="396" y="344" fill="#516276" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">Authenticator codes</text>
    <text x="396" y="369" fill="#516276" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">and passkeys.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="662" y="168" width="230" height="210" rx="22" fill="url(#card)" stroke="#c8d8e8"/>
    <rect x="692" y="198" width="74" height="56" rx="14" fill="#fff1d0"/>
    <path d="M704 226 h50" stroke="#b57409" stroke-width="8" stroke-linecap="round"/>
    <circle cx="778" cy="226" r="26" fill="#fff1d0" stroke="#b57409" stroke-width="7"/>
    <path d="M791 226 h24 m-8 0 v18" stroke="#b57409" stroke-width="7" stroke-linecap="round"/>
    <text x="692" y="292" fill="#1f2a44" font-family="Avenir Next, Segoe UI, sans-serif" font-size="20" font-weight="700">Fresh approval</text>
    <text x="692" y="322" fill="#516276" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">Required for expensive,</text>
    <text x="692" y="348" fill="#516276" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">destructive, or admin actions.</text>
  </g>

  <path d="M300 270 C326 270 337 270 360 270" fill="none" stroke="#2f6f8f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M598 270 C624 270 635 270 658 270" fill="none" stroke="#2f6f8f" stroke-width="5" marker-end="url(#arrow)"/>

  <g>
    <rect x="104" y="430" width="752" height="62" rx="18" fill="#1f2a44" opacity="0.94"/>
    <text x="134" y="467" fill="#ffffff" font-family="Avenir Next, Segoe UI, sans-serif" font-size="18" font-weight="700">Defense in depth:</text>
    <text x="302" y="467" fill="#dbe8f4" font-family="Avenir Next, Segoe UI, sans-serif" font-size="18">SSO protects login; CoCalc 2FA protects dangerous actions right now.</text>
  </g>
</svg>
